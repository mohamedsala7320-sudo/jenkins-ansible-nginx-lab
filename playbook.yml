- name: Install and configure Nginx locally
  hosts: localhost
  become: true


  tasks:
    - name: Refresh APT package cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      
    - name: Install Nginx package
      apt:
        name: nginx
        state: present

    - name: Start Nginx service and enable it at boot
      service:
        name: nginx
        state: started
        enabled: true
        use: service